<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Music - Trình Nghe Nhạc Tinh Gọn</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <!-- Dynamic Ambient Background Glow -->
    <div class="ambient-glow glow-primary" id="glowPrimary"></div>
    <div class="ambient-glow glow-secondary" id="glowSecondary"></div>

    <div class="player-wrapper">
        <!-- Main Player Card -->
        <main class="player-card">
            <!-- Header Bar -->
            <header class="player-header">
                <button class="header-icon-btn" id="themeToggle" title="Chuyển chế độ giao diện">
                    <i class="fa-regular fa-moon"></i>
                </button>
                <div class="header-title">
                    <span class="badge-live"></span>
                    <span>ĐANG PHÁT</span>
                </div>
                <button class="header-icon-btn" id="playlistToggle" title="Danh sách phát">
                    <i class="fa-solid fa-list-ul"></i>
                </button>
            </header>

            <!-- Album Art & Vinyl Effect -->
            <div class="album-container">
                <div class="vinyl" id="vinyl">
                    <div class="vinyl-groove"></div>
                    <div class="vinyl-center"></div>
                </div>
                <div class="album-art-wrap">
                    <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=600&q=80" alt="Album Cover" class="album-art" id="coverImg">
                    <!-- Soundwave Animation when playing -->
                    <div class="sound-wave" id="soundWave">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            </div>

            <!-- Song Info & Like Button -->
            <div class="song-info">
                <div class="title-wrap">
                    <h2 class="song-title" id="songTitle">Lạc Vào Giấc Mơ</h2>
                    <p class="song-artist" id="songArtist">Acoustic Chillout</p>
                </div>
                <button class="like-btn" id="likeBtn" title="Thích bài hát">
                    <i class="fa-regular fa-heart"></i>
                </button>
            </div>

            <!-- Progress Bar -->
            <div class="progress-section">
                <div class="progress-bar-container" id="progressContainer">
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-thumb"></div>
                    </div>
                </div>
                <div class="time-row">
                    <span id="currentTime">00:00</span>
                    <span id="totalDuration">03:30</span>
                </div>
            </div>

            <!-- Playback Controls -->
            <div class="controls-row">
                <button class="ctrl-btn" id="shuffleBtn" title="Phát ngẫu nhiên">
                    <i class="fa-solid fa-shuffle"></i>
                </button>
                <button class="ctrl-btn" id="prevBtn" title="Bài trước">
                    <i class="fa-solid fa-backward-step"></i>
                </button>
                <button class="ctrl-btn play-main-btn" id="playBtn" title="Phát / Tạm dừng">
                    <i class="fa-solid fa-play" id="playIcon"></i>
                </button>
                <button class="ctrl-btn" id="nextBtn" title="Bài tiếp">
                    <i class="fa-solid fa-forward-step"></i>
                </button>
                <button class="ctrl-btn" id="repeatBtn" title="Lặp lại bài hát">
                    <i class="fa-solid fa-repeat"></i>
                </button>
            </div>

            <!-- Volume Slider -->
            <div class="volume-row">
                <button class="volume-icon-btn" id="muteBtn" title="Tắt / Bật tiếng">
                    <i class="fa-solid fa-volume-high" id="volumeIcon"></i>
                </button>
                <div class="volume-slider-container" id="volumeContainer">
                    <div class="volume-bar" id="volumeBar" style="width: 80%;">
                        <div class="volume-thumb"></div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Slide-out Playlist Drawer -->
        <aside class="playlist-drawer" id="playlistDrawer">
            <div class="drawer-header">
                <h3>Danh Sách Tuyển Chọn</h3>
                <button class="close-drawer-btn" id="closeDrawerBtn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <ul class="playlist-items" id="playlistList">
                <!-- Generated by JS -->
            </ul>
        </aside>
    </div>

    <!-- Hidden HTML5 Audio Element -->
    <audio id="audioPlayer" preload="metadata"></audio>

    <!-- Script logic -->
    <script>
        // Track list (using reliable royalty-free audio streams)
        const tracks = [
            {
                title: "Lạc Vào Giấc Mơ",
                artist: "Hoàng Dũng & Vũ. (Acoustic)",
                cover: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=600&q=80",
                duration: "03:25",
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
                glow1: "rgba(120, 80, 240, 0.4)",
                glow2: "rgba(255, 100, 150, 0.35)"
            },
            {
                title: "Midnight Coffee Lofi",
                artist: "ChilledCow Beatmaker",
                cover: "https://images.unsplash.com/photo-1501386761578-eac5c94b800a?auto=format&fit=crop&w=600&q=80",
                duration: "04:12",
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
                glow1: "rgba(0, 200, 255, 0.35)",
                glow2: "rgba(100, 80, 240, 0.4)"
            },
            {
                title: "Tháng Năm Bình Yên",
                artist: "Chillies & Nguyên Hà",
                cover: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=600&q=80",
                duration: "03:48",
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
                glow1: "rgba(255, 120, 50, 0.35)",
                glow2: "rgba(230, 50, 120, 0.35)"
            },
            {
                title: "Neon City Rain",
                artist: "Synthwave Breeze",
                cover: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=600&q=80",
                duration: "03:15",
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3",
                glow1: "rgba(0, 255, 180, 0.35)",
                glow2: "rgba(0, 150, 255, 0.4)"
            },
            {
                title: "Cung Đàn Mùa Thu",
                artist: "Thịnh Suy & Kimmese",
                cover: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=600&q=80",
                duration: "03:52",
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3",
                glow1: "rgba(240, 180, 40, 0.35)",
                glow2: "rgba(220, 50, 100, 0.35)"
            }
        ];

        let currentTrackIndex = 0;
        let isPlaying = false;
        let isMuted = false;
        let isShuffle = false;
        let isRepeat = false;

        // Elements
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const repeatBtn = document.getElementById('repeatBtn');
        const likeBtn = document.getElementById('likeBtn');
        
        const songTitle = document.getElementById('songTitle');
        const songArtist = document.getElementById('songArtist');
        const coverImg = document.getElementById('coverImg');
        const vinyl = document.getElementById('vinyl');
        const soundWave = document.getElementById('soundWave');
        
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const totalDurationEl = document.getElementById('totalDuration');

        const volumeContainer = document.getElementById('volumeContainer');
        const volumeBar = document.getElementById('volumeBar');
        const muteBtn = document.getElementById('muteBtn');
        const volumeIcon = document.getElementById('volumeIcon');

        const glowPrimary = document.getElementById('glowPrimary');
        const glowSecondary = document.getElementById('glowSecondary');

        const playlistToggle = document.getElementById('playlistToggle');
        const playlistDrawer = document.getElementById('playlistDrawer');
        const closeDrawerBtn = document.getElementById('closeDrawerBtn');
        const playlistList = document.getElementById('playlistList');

        // Load Track
        function loadTrack(index) {
            const track = tracks[index];
            songTitle.innerText = track.title;
            songArtist.innerText = track.artist;
            coverImg.src = track.cover;
            audio.src = track.url;
            totalDurationEl.innerText = track.duration;

            // Ambient background colors match current track
            glowPrimary.style.background = `radial-gradient(circle, ${track.glow1}, transparent 70%)`;
            glowSecondary.style.background = `radial-gradient(circle, ${track.glow2}, transparent 70%)`;

            updatePlaylistActiveState();
        }

        // Render Playlist
        function renderPlaylist() {
            playlistList.innerHTML = '';
            tracks.forEach((track, i) => {
                const li = document.createElement('li');
                li.className = `playlist-item ${i === currentTrackIndex ? 'active' : ''}`;
                li.innerHTML = `
                    <div class="item-thumb"><img src="${track.cover}" alt="${track.title}"></div>
                    <div class="item-text">
                        <span class="item-title">${track.title}</span>
                        <span class="item-artist">${track.artist}</span>
                    </div>
                    <span class="item-time">${track.duration}</span>
                `;
                li.addEventListener('click', () => {
                    currentTrackIndex = i;
                    loadTrack(currentTrackIndex);
                    playTrack();
                    playlistDrawer.classList.remove('open');
                });
                playlistList.appendChild(li);
            });
        }

        function updatePlaylistActiveState() {
            const items = playlistList.querySelectorAll('.playlist-item');
            items.forEach((item, idx) => {
                if (idx === currentTrackIndex) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }

        // Play / Pause Logic
        function playTrack() {
            audio.play().then(() => {
                isPlaying = true;
                playIcon.className = 'fa-solid fa-pause';
                vinyl.classList.add('spinning');
                soundWave.classList.add('active');
            }).catch(e => {
                console.log("Audio autoplay prevented or resource loaded with interaction requirement", e);
                // Still toggle visually for user feedback
                isPlaying = true;
                playIcon.className = 'fa-solid fa-pause';
                vinyl.classList.add('spinning');
                soundWave.classList.add('active');
            });
        }

        function pauseTrack() {
            audio.pause();
            isPlaying = false;
            playIcon.className = 'fa-solid fa-play';
            vinyl.classList.remove('spinning');
            soundWave.classList.remove('active');
        }

        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                pauseTrack();
            } else {
                playTrack();
            }
        });

        // Next / Prev
        function nextTrack() {
            if (isShuffle) {
                currentTrackIndex = Math.floor(Math.random() * tracks.length);
            } else {
                currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
            }
            loadTrack(currentTrackIndex);
            if (isPlaying) playTrack();
        }

        function prevTrack() {
            currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
            loadTrack(currentTrackIndex);
            if (isPlaying) playTrack();
        }

        nextBtn.addEventListener('click', nextTrack);
        prevBtn.addEventListener('click', prevTrack);

        // Repeat & Shuffle Toggle
        repeatBtn.addEventListener('click', () => {
            isRepeat = !isRepeat;
            repeatBtn.classList.toggle('active', isRepeat);
        });

        shuffleBtn.addEventListener('click', () => {
            isShuffle = !isShuffle;
            shuffleBtn.classList.toggle('active', isShuffle);
        });

        // Audio Events
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressBar.style.width = percent + '%';
                currentTimeEl.innerText = formatTime(audio.currentTime);
            }
        });

        audio.addEventListener('loadedmetadata', () => {
            if (audio.duration && !isNaN(audio.duration)) {
                totalDurationEl.innerText = formatTime(audio.duration);
            }
        });

        audio.addEventListener('ended', () => {
            if (isRepeat) {
                audio.currentTime = 0;
                playTrack();
            } else {
                nextTrack();
            }
        });

        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min < 10 ? '0' : ''}${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        // Seek Progress
        progressContainer.addEventListener('click', (e) => {
            const rect = progressContainer.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const percent = Math.min(Math.max(clickX / rect.width, 0), 1);
            if (audio.duration) {
                audio.currentTime = percent * audio.duration;
            }
            progressBar.style.width = (percent * 100) + '%';
        });

        // Volume Control
        audio.volume = 0.8;
        volumeContainer.addEventListener('click', (e) => {
            const rect = volumeContainer.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const percent = Math.min(Math.max(clickX / rect.width, 0), 1);
            audio.volume = percent;
            volumeBar.style.width = (percent * 100) + '%';
            updateVolumeIcon(percent);
        });

        function updateVolumeIcon(vol) {
            if (vol === 0) {
                volumeIcon.className = 'fa-solid fa-volume-xmark';
            } else if (vol < 0.5) {
                volumeIcon.className = 'fa-solid fa-volume-low';
            } else {
                volumeIcon.className = 'fa-solid fa-volume-high';
            }
        }

        muteBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            audio.muted = isMuted;
            if (isMuted) {
                volumeBar.style.width = '0%';
                volumeIcon.className = 'fa-solid fa-volume-xmark';
            } else {
                volumeBar.style.width = (audio.volume * 100) + '%';
                updateVolumeIcon(audio.volume);
            }
        });

        // Like button toggle
        likeBtn.addEventListener('click', () => {
            likeBtn.classList.toggle('liked');
            const icon = likeBtn.querySelector('i');
            if (likeBtn.classList.contains('liked')) {
                icon.className = 'fa-solid fa-heart';
            } else {
                icon.className = 'fa-regular fa-heart';
            }
        });

        // Playlist Drawer Toggle
        playlistToggle.addEventListener('click', () => {
            playlistDrawer.classList.add('open');
        });

        closeDrawerBtn.addEventListener('click', () => {
            playlistDrawer.classList.remove('open');
        });

        // Theme toggle (Dark / Soft Glass)
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-theme');
            const icon = themeToggle.querySelector('i');
            if (document.body.classList.contains('light-theme')) {
                icon.className = 'fa-regular fa-sun';
            } else {
                icon.className = 'fa-regular fa-moon';
            }
        });

        // Initialize
        loadTrack(0);
        renderPlaylist();
    </script>
</body>
</html>
